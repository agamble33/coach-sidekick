[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-sidekick"
version = "0.0.1"
description = "Coach: an AI co-op teammate built on Meta's Muse models"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# reaction cards, sound stings and avatars ship inside the installed package (the Docker image
# pip-installs the project, so anything not listed here would be missing on Render)
"coach.reactions" = ["reactions.json", "assets/**/*.png", "assets/**/*.mp3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
